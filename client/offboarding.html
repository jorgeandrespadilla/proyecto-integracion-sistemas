<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recursos Humanos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            color: #333;
        }

        form {
            max-width: 400px;
            margin: 20px 0;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        button {
            background-color: #df4646;
            color: #fff;
            padding: 10px;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #df4646;
        }

        a {
            display: block;
            margin-top: 10px;
            text-decoration: none;
            color: #007BFF;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <h1>Offboarding</h1>

    <form id="userForm">
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required>

        <button type="button" onclick="submitForm()">Dar de baja al usuario</button>
    </form>

    <a href="onboarding.html">Onboarding</a>
    <a href="offboarding.html">Offboarding</a>

    <script>
        function submitForm() {
            const form = document.getElementById('userForm');
            const formData = new FormData(form);

            const jsonData = {};
            formData.forEach((value, key) => {
                jsonData[key] = value;
            });

            fetch('http://127.0.0.1:5000/offboarding', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(jsonData)
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Falló la petición HTTP: ' + response.status);
                    }
                    return response.json();
                })
                .then(data => {
                    // Handle the API response data
                    console.log(data);
                })
                .catch(error => {
                    // Handle errors
                    console.error('Ocurrió un error inesperado', error);
                });
        }
    </script>
</body>

</html>
