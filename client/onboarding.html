<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recursos Humanos - Onboarding</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            color: #333;
        }

        form {
            max-width: 400px;
            margin: 20px 0;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        button {
            background-color: #45a049;
            color: #fff;
            padding: 10px;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        a {
            display: block;
            margin-top: 10px;
            text-decoration: none;
            color: #007BFF;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div id="main-container">
        <h1>Onboarding</h1>

        <form id="userForm">
            <label for="name">Nombre:</label>
            <input type="text" id="name" name="name" required>

            <label for="work_phone">Teléfono de trabajo:</label>
            <input type="tel" id="work_phone" name="work_phone" required>

            <label for="private_email">Correo privado:</label>
            <input type="email" id="private_email" name="private_email" required>

            <button type="button" onclick="submitForm()">Crear usuario</button>
        </form>

        <a href="onboarding.html">Onboarding</a>
        <a href="offboarding.html">Offboarding</a>
    </div>

    <script>
        function submitForm() {
            const form = document.getElementById('userForm');
            const formData = new FormData(form);

            const jsonData = {};
            formData.forEach((value, key) => {
                jsonData[key] = value;
            });

            fetch('http://127.0.0.1:5000/onboarding', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(jsonData)
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Falló la petición HTTP: ' + response.status);
                    }
                    return response.json();
                })
                .then(data => {
                    // Handle the API response data
                    console.log(data);
                })
                .catch(error => {
                    // Handle errors
                    console.error('Ocurrió un error inesperado', error);
                });
        }
    </script>
</body>

</html>
